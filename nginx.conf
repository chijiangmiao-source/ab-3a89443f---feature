server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 健康检查路径
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # 静态资源缓存
    location ~* \.(?:js|css|svg|png|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # SPA 回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
